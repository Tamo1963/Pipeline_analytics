[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pipeline-analytics"
version = "0.1.0"
description = "Cross-country pipeline feasibility suite: pipe specification library, engineering core and feasibility bot."
readme = "README.md"
license = "CC0-1.0"
requires-python = ">=3.11"
dependencies = [
    "pint>=0.24",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_analytics"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "apps"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
